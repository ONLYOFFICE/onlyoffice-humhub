name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build Artifact
        uses: ./.github/actions/pack
        id: pack
      - name: Check Version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match module.json version $VERSION"; exit 1; }
      - name: Pack Artifact
        env:
          ID: ${{ steps.pack.outputs.id }}
        run: |
          cd deploy
          zip -r "../$ID.zip" onlyoffice
      - name: Get Release Notes
        run: |
          awk '/## [0-9]/{p++} p; /## [0-9]/{if (p > 1) exit}' CHANGELOG.md | awk 'NR>2 {print last} {last=$0}' > RELEASE.md
      - name: Release Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.pack.outputs.id }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "$ID.zip" --title "$TAG" --notes-file RELEASE.md --verify-tag
