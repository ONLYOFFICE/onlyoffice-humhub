name: Artifact

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build Artifact
        uses: ./.github/actions/pack
        id: pack
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.id }}
          path: deploy
